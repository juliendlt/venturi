[project]
name = "venturi-data-prep"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "delta-spark>=4.4.1",
    "ipykernel>=7.4.0",
    "pydantic>=2.14.3",
    "pyspark>=4.2.0",
    "pyyaml>=6.0.3",
]

[project.scripts]
venturi = "venturi.main:main"
venturi-map = "venturi.app.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/venturi"]
